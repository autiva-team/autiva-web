# =============================================================================
# Análisis de calidad de código con SonarQube Cloud - autiva-web (React + Vite)
# -----------------------------------------------------------------------------
# Se ejecuta automáticamente:
#   - en cada push a develop (rama principal del proyecto en SonarQube Cloud)
#   - en cada Pull Request (SonarQube comenta el resultado del Quality Gate)
# El token se lee del secreto SONAR_TOKEN; nunca se escribe en el código.
# Solo se excluyen carpetas que no escribe el equipo (dependencias y build).
# =============================================================================
name: Calidad de código (SonarQube Cloud)

on:
  push:
    branches: [develop]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:   # permite ejecutarlo a mano desde la pestaña Actions

jobs:
  sonarqube:
    name: Análisis SonarQube Cloud
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historial completo: SonarQube lo usa para detectar código nuevo

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Las pruebas generan coverage/lcov.info, que SonarQube usa para medir la cobertura.
      - name: Ejecutar pruebas con cobertura
        run: npm run test:coverage

      # La cobertura se mide sobre la lógica (.js). Los componentes visuales (.jsx),
      # los estilos y el service worker se excluyen solo del cálculo de cobertura;
      # el resto del análisis (bugs, vulnerabilidades, code smells) sí los revisa.
      - name: Analizar con SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=autiva-team
            -Dsonar.projectKey=autiva-team_autiva-web
            -Dsonar.sources=src
            -Dsonar.exclusions=**/node_modules/**,dist/**,coverage/**,**/*.test.js,src/test/**
            -Dsonar.tests=src
            -Dsonar.test.inclusions=**/*.test.js
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.coverage.exclusions=**/*.jsx,**/*.css,src/sw.js
